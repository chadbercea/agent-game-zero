# Builds the sandbox and Storybook and publishes them to GitHub Pages on every
# push to main:
#   https://chadbercea.github.io/agent-game-zero/            → sandbox
#   https://chadbercea.github.io/agent-game-zero/storybook/  → Storybook
#
# One-time setup in the repo: the repo must be public (or on a paid plan), and
# Settings → Pages → Source must be "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the sandbox
        run: npm run build
        env:
          BASE: /agent-game-zero/
      - name: Build Storybook into /storybook
        run: npx storybook build --output-dir dist/storybook --quiet
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
